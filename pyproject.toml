[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent-evaluation-bench"
version = "0.1.0"
description = "Reproducible coding-agent evaluation for realistic backend bug fixes"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
code-eval = "evaluator.runner:main"

[tool.setuptools.packages.find]
include = ["evaluator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
